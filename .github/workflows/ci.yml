name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm tsc -b

      - name: Lint
        run: pnpm eslint .

      - name: Knip (Dead Code/Dependencies)
        run: pnpm knip

      - name: Test (Domain)
        run: pnpm --filter @aegis/domain test

      - name: Build Web
        run: pnpm --filter @aegis/web build
